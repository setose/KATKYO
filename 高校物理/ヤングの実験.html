<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヤングの実験：角度θの謎を解くビジュアライザー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        /* SVG要素のフェードアニメーション用 */
        .svg-layer {
            transition: opacity 0.5s ease-in-out;
        }
        /* パターン背景（方眼紙風） */
        .bg-grid {
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800 flex flex-col items-center">

    <header class="max-w-5xl w-full mb-6 text-center">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">🔍 ヤングの実験：2つの「θ」が同じになる理由</h1>
        <p class="text-slate-600 text-sm md:text-base">物理の難しい計算は一旦忘れて、図形パズルとしてステップ・バイ・ステップで解き明かしましょう！</p>
    </header>

    <main class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col lg:flex-row">
        
        <!-- 左側：ビジュアルエリア -->
        <div class="w-full lg:w-3/5 bg-slate-50 relative p-4 flex items-center justify-center border-b lg:border-b-0 lg:border-r border-slate-200 bg-grid">
            <svg viewBox="0 0 800 500" class="w-full h-auto max-h-[60vh] drop-shadow-md bg-white/80 rounded-xl">
                
                <!-- 共通ベースレイヤー（常に表示） -->
                <g id="layer-base" class="svg-layer opacity-100">
                    <!-- スリットの壁 -->
                    <line x1="200" y1="50" x2="200" y2="450" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
                    
                    <!-- S1 -->
                    <circle cx="200" cy="150" r="7" fill="#0f172a"/>
                    <text x="160" y="158" class="text-2xl font-bold" fill="#0f172a">S₁</text>
                    
                    <!-- S2 -->
                    <circle cx="200" cy="350" r="7" fill="#0f172a"/>
                    <text x="160" y="358" class="text-2xl font-bold" fill="#0f172a">S₂</text>
                    
                    <!-- スリット間隔 d の表示 -->
                    <path d="M 145 160 Q 120 250 145 340" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
                    <text x="100" y="260" class="text-2xl italic font-serif" fill="#64748b">d</text>
                </g>

                <!-- Step 1: 中心からの線と右のθ -->
                <g id="layer-ray-center" class="svg-layer opacity-0">
                    <!-- 中心からの水平線 -->
                    <line x1="200" y1="250" x2="750" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
                    <!-- 中心からの斜め線（角度 30度） -->
                    <line x1="200" y1="250" x2="633" y2="0" stroke="#cbd5e1" stroke-width="4"/>
                </g>
                <g id="layer-arc-theta-center" class="svg-layer opacity-0">
                    <!-- 右のθ 円弧 (半径60) -->
                    <path d="M 260 250 A 60 60 0 0 0 252 220" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                    <text x="275" y="240" class="text-3xl italic font-bold font-serif" fill="#0ea5e9">θ</text>
                    
                    <!-- スクリーンが遠いことを示す吹き出し -->
                    <g transform="translate(450, 80)">
                        <rect x="0" y="0" width="280" height="70" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
                        <text x="15" y="30" class="text-sm font-bold" fill="#0369a1">前提条件: d ≪ l</text>
                        <text x="15" y="52" class="text-xs" fill="#0284c7">スクリーンが遠いため、光は</text>
                        <text x="15" y="68" class="text-xs" fill="#0284c7">「平行」に進むとみなせます。</text>
                    </g>
                </g>

                <!-- Step 2: S2からの光線と水平線 -->
                <g id="layer-ray-s2" class="svg-layer opacity-0">
                    <!-- S2からの光線（角度 30度） -->
                    <line x1="200" y1="350" x2="633" y2="100" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
                    <text x="645" y="100" class="text-xl font-bold" fill="#ef4444">スクリーン上の点Pへ</text>
                </g>
                <g id="layer-horiz-s2" class="svg-layer opacity-0">
                    <!-- S2の水平補助線 -->
                    <line x1="200" y1="350" x2="450" y2="350" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
                </g>
                <g id="layer-arc-theta-s2" class="svg-layer opacity-0">
                    <!-- S2のθ 円弧 (半径80) -->
                    <path d="M 280 350 A 80 80 0 0 0 269.3 310" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                    <text x="295" y="340" class="text-3xl italic font-bold font-serif" fill="#0ea5e9">θ</text>
                </g>

                <!-- Step 3: 壁との間の角度 -->
                <g id="layer-angle-90-s2" class="svg-layer opacity-0">
                    <!-- S2の直角マーク -->
                    <polyline points="200,315 235,315 235,350" fill="none" stroke="#94a3b8" stroke-width="3"/>
                </g>
                <g id="layer-arc-90-minus-theta" class="svg-layer opacity-0">
                    <!-- (90 - θ) の円弧 (半径50) -->
                    <path d="M 200 300 A 50 50 0 0 1 243.3 325" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                    <text x="210" y="290" class="text-xl italic font-bold font-serif" fill="#f59e0b">90° - θ</text>
                </g>

                <!-- Step 4: 垂線と小さな直角三角形 -->
                <g id="layer-line-s1-h" class="svg-layer opacity-0">
                    <!-- 直角三角形の塗りつぶし -->
                    <polygon points="200,150 200,350 286.6,300" fill="#10b981" fill-opacity="0.15" />
                    <!-- S1からの垂線 -->
                    <line x1="200" y1="150" x2="286.6" y2="300" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
                </g>
                <g id="layer-angle-90-h" class="svg-layer opacity-0">
                    <!-- H点の直角マーク -->
                    <polyline points="269.3,310 259.3,292.7 276.6,282.7" fill="none" stroke="#10b981" stroke-width="3"/>
                </g>
                <g id="layer-ray-s1-faded" class="svg-layer opacity-0">
                    <!-- S1からの光線（平行線としてPへ向かう） -->
                    <line x1="200" y1="150" x2="633" y2="-100" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,6"/>
                </g>

                <!-- Step 5: 左上のθの完成 -->
                <g id="layer-arc-theta-left" class="svg-layer opacity-0">
                    <!-- S1 左のθ 円弧 (半径70) -->
                    <path d="M 200 220 A 70 70 0 0 0 235 210.6" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
                    <text x="215" y="250" class="text-4xl italic font-bold font-serif" fill="#0ea5e9">θ</text>
                    
                    <!-- 結論の吹き出し -->
                    <g transform="translate(40, 60)">
                        <rect x="0" y="0" width="130" height="40" rx="20" fill="#0ea5e9" opacity="0.9"/>
                        <text x="65" y="26" class="text-lg font-bold" fill="white" text-anchor="middle">全く同じ！</text>
                    </g>
                    <!-- 矢印 -->
                    <path d="M 120 100 Q 150 140 190 200" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
                        </marker>
                    </defs>
                </g>
                <g id="layer-path-diff" class="svg-layer opacity-0">
                    <!-- 経路差 d sinθ のテキスト -->
                    <text x="260" y="375" class="text-2xl italic font-bold font-serif" fill="#ef4444" transform="rotate(-30, 260, 375)">d sinθ</text>
                    <!-- 強調の波線風ライン -->
                    <path d="M 205 358 Q 243.3 336 295 308" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
                </g>

            </svg>
        </div>

        <!-- 右側：コントロールと解説エリア -->
        <div class="w-full lg:w-2/5 p-6 md:p-8 flex flex-col justify-between bg-white">
            
            <div>
                <!-- ステップインジケーター -->
                <div class="flex items-center space-x-2 mb-6" id="step-indicators">
                    <!-- JSで動的に生成 -->
                </div>

                <!-- テキストエリア -->
                <div class="min-h-[250px]">
                    <span id="step-badge" class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wide">
                        Start
                    </span>
                    <h2 id="step-title" class="text-xl md:text-2xl font-bold text-slate-800 mb-4 transition-all duration-300">
                        <!-- タイトルが入る -->
                    </h2>
                    <div id="step-description" class="text-slate-600 leading-relaxed transition-all duration-300">
                        <!-- 解説文が入る -->
                    </div>
                </div>
            </div>

            <!-- ナビゲーションボタン -->
            <div class="flex justify-between items-center mt-8 pt-6 border-t border-slate-100">
                <button id="btn-prev" class="px-5 py-2.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition-colors disabled:opacity-30 disabled:cursor-not-allowed border border-slate-200">
                    ← 前のステップ
                </button>
                <button id="btn-next" class="px-6 py-2.5 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md hover:shadow-lg transition-all transform active:scale-95">
                    次へ進む →
                </button>
            </div>
        </div>
    </main>

    <script>
        // 各ステップのデータ定義
        const steps = [
            {
                badge: "Introduction",
                title: "光は「平行」に進む",
                description: `
                    <p class="mb-3">ヤングの実験の図では、スリット（穴）の隙間 <span class="font-bold italic">d</span> に対して、右側にあるスクリーンが<strong>とても遠く</strong>にあります。</p>
                    <p class="mb-3 p-3 bg-blue-50 rounded-lg text-blue-900 border border-blue-100">
                        そのため、スリットから出た光の線は、広がらずに<strong>「ほぼ平行な線」</strong>として進むとみなすことができます。これが最大のポイントです！
                    </p>
                    <p>右側の水色の角度 <span class="text-cyan-600 font-bold text-xl font-serif">θ</span>（シータ）は、光の線が水平線に対してどれくらい傾いているかを表しています。</p>
                `,
                showLayers: ['layer-ray-center', 'layer-arc-theta-center']
            },
            {
                badge: "Step 1",
                title: "下の光線も同じ角度",
                description: `
                    <p class="mb-3">光線は平行なので、下のスリット（S₂）から出る光線も全く同じ傾きになります。</p>
                    <p>S₂から真横に<strong>水平な補助線</strong>を引いてみましょう。</p>
                    <p class="mt-4 font-semibold text-slate-800">
                        平行な線の傾きは同じ（同位角）なので、ここの角度も同じ <span class="text-cyan-600 font-bold text-xl font-serif">θ</span> になります。
                    </p>
                `,
                showLayers: ['layer-ray-center', 'layer-arc-theta-center', 'layer-ray-s2', 'layer-horiz-s2', 'layer-arc-theta-s2']
            },
            {
                badge: "Step 2",
                title: "縦の壁との角度は？",
                description: `
                    <p class="mb-3">次に、左側の「縦の壁」に注目します。</p>
                    <p class="mb-3">縦の壁と、先ほど引いた水平な補助線は、当然 <strong>90°（直角）</strong> で交わります。</p>
                    <p class="p-3 bg-amber-50 rounded-lg text-amber-900 border border-amber-200">
                        直角の中から下の <span class="text-cyan-600 font-bold font-serif">θ</span> の分を引くと、残った上の角度（壁と光線の間の角度）は <span class="text-amber-600 font-bold text-lg font-serif">90° - θ</span> になります。
                    </p>
                `,
                showLayers: ['layer-ray-s2', 'layer-horiz-s2', 'layer-arc-theta-s2', 'layer-angle-90-s2', 'layer-arc-90-minus-theta']
            },
            {
                badge: "Step 3",
                title: "小さな直角三角形を作る",
                description: `
                    <p class="mb-3">いよいよ大詰めです。</p>
                    <p class="mb-3">上のスリット（S₁）から、下の光線に向かって<strong>垂線（90°に交わる線）</strong>を下ろします。</p>
                    <p>すると、緑色で塗られた<strong>小さな直角三角形</strong>が出来上がります。<br>三角形の内側の角度（内角）は、全部足すと必ず 180° になりますね。</p>
                `,
                showLayers: ['layer-ray-s2', 'layer-arc-90-minus-theta', 'layer-line-s1-h', 'layer-angle-90-h', 'layer-ray-s1-faded']
            },
            {
                badge: "Conclusion",
                title: "パズル完成！",
                description: `
                    <p class="mb-3">小さな直角三角形の3つの角に注目しましょう。</p>
                    <ul class="list-disc list-inside mb-4 text-slate-700 space-y-1 ml-2">
                        <li>右下の角は <span class="font-bold">90°</span></li>
                        <li>左下の角は <span class="text-amber-600 font-bold font-serif">90° - θ</span></li>
                    </ul>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                        <p class="text-sm text-slate-500 mb-1">左上の角を求める計算式：</p>
                        <p class="font-mono text-center">180° - 90° - (<span class="text-amber-600 font-bold font-serif">90° - θ</span>)</p>
                        <p class="font-mono text-center mt-2 border-t pt-2">= 90° - 90° + <span class="text-cyan-600 font-bold font-serif">θ</span></p>
                        <p class="font-mono text-center mt-2 text-2xl">= <span class="text-cyan-600 font-bold font-serif">θ</span></p>
                    </div>
                    <p class="font-bold text-lg text-blue-700 text-center">図の2つのθは、全く同じ角度です！</p>
                `,
                showLayers: ['layer-ray-s2', 'layer-arc-90-minus-theta', 'layer-line-s1-h', 'layer-angle-90-h', 'layer-ray-s1-faded', 'layer-arc-theta-left', 'layer-path-diff']
            }
        ];

        let currentStepIndex = 0;

        // DOM要素の取得
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const badgeEl = document.getElementById('step-badge');
        const titleEl = document.getElementById('step-title');
        const descEl = document.getElementById('step-description');
        const indicatorsContainer = document.getElementById('step-indicators');

        // インジケーターの初期生成
        steps.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `w-2.5 h-2.5 rounded-full transition-colors duration-300 ${index === 0 ? 'bg-blue-600' : 'bg-slate-200'}`;
            dot.id = `indicator-${index}`;
            indicatorsContainer.appendChild(dot);
        });

        // 画面更新関数
        function updateUI() {
            const step = steps[currentStepIndex];

            // テキストの更新（フェード効果をつけるため一時的に透明にする）
            titleEl.style.opacity = 0;
            descEl.style.opacity = 0;
            
            setTimeout(() => {
                badgeEl.innerText = step.badge;
                titleEl.innerText = step.title;
                descEl.innerHTML = step.description;
                titleEl.style.opacity = 1;
                descEl.style.opacity = 1;
            }, 150);

            // SVGレイヤーの更新
            const allLayers = document.querySelectorAll('.svg-layer');
            allLayers.forEach(layer => {
                if (layer.id === 'layer-base') return; // baseは常に表示
                
                if (step.showLayers.includes(layer.id)) {
                    layer.classList.remove('opacity-0');
                    layer.classList.add('opacity-100');
                } else {
                    layer.classList.remove('opacity-100');
                    layer.classList.add('opacity-0');
                }
            });

            // ボタン状態の更新
            btnPrev.disabled = currentStepIndex === 0;
            
            if (currentStepIndex === steps.length - 1) {
                btnNext.innerText = "最初から見る ↻";
                btnNext.classList.replace('bg-blue-600', 'bg-emerald-600');
                btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
            } else {
                btnNext.innerText = "次へ進む →";
                btnNext.classList.replace('bg-emerald-600', 'bg-blue-600');
                btnNext.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');
            }

            // インジケーターの更新
            steps.forEach((_, index) => {
                const dot = document.getElementById(`indicator-${index}`);
                if (index === currentStepIndex) {
                    dot.className = 'w-4 h-2.5 rounded-full transition-all duration-300 bg-blue-600';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full transition-all duration-300 bg-slate-200';
                }
            });
        }

        // イベントリスナー
        btnNext.addEventListener('click', () => {
            if (currentStepIndex < steps.length - 1) {
                currentStepIndex++;
            } else {
                currentStepIndex = 0; // 最後まで行ったら最初に戻る
            }
            updateUI();
        });

        btnPrev.addEventListener('click', () => {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateUI();
            }
        });

        // 初期化実行
        updateUI();

    </script>
</body>
</html>
